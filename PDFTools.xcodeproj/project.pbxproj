				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/PDFTools/CompressionEstimator.swift",
				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/PDFTools/PageTools/PageAssemblyService.swift",
				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/PDFTools/PageTools/MergeViewModel.swift",
				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/PDFTools/CompressionViewModel.swift",
				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/PDFTools/PageTools/CompressionOptions.swift",
				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/PDFToolsTests/CorpusRunnerCore.swift",
				"$(BUILT_PRODUCTS_DIR)/SourceSnapshot/Scripts/release-check.sh",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Kopiert die Quellen, die Gate-Tests im Klartext prüfen, in das\n# Build-Verzeichnis.\n#\n# Grund: Der Test-Host ist eine sandboxed App. Liegt das Projekt unter\n# ~/Desktop (TCC-geschützt), BLOCKIERT jeder Lesezugriff des Testprozesses\n# darauf, statt zu scheitern - gemessen: Lesen aus $TMPDIR 0.001 s, Lesen\n# derselben Datei unter ~/Desktop lief in das Zeitlimit. Ohne Zeitlimit\n# hielt das die gesamte Suite an, ohne eine einzige Meldung.\n#\n# BUILT_PRODUCTS_DIR liegt in DerivedData unter ~/Library und ist nicht\n# TCC-geschützt. Die Kopie entsteht bei jedem Bau neu und ist damit\n# immer der Stand, der auch kompiliert wurde.\nset -e\nDEST=\"$BUILT_PRODUCTS_DIR/SourceSnapshot\"\nmkdir -p \"$DEST/PDFTools/PageTools\" \"$DEST/Scripts\"\ncd \"$SRCROOT\"\nfor f in PDFTools/CompressionEngineState.swift PDFTools/Compressor.swift \\\n         PDFTools/CompressionEstimator.swift \\\n         PDFTools/PageTools/PageAssemblyService.swift \\\n         PDFTools/PageTools/MergeViewModel.swift \\\n         PDFTools/CompressionViewModel.swift \\\n         PDFTools/PageTools/CompressionOptions.swift; do\n    [ -f \"$f\" ] && cp \"$f\" \"$DEST/$f\"\ndone\ncp Scripts/release-check.sh \"$DEST/Scripts/\" 2>/dev/null || true\n# Der CorpusRunner steht im Testziel, wird aber im Klartext geprueft:\n# Er darf keine eigenen Kompressionspresets mehr bauen (Plan 2.3).\nmkdir -p \"$DEST/PDFToolsTests\"\ncp PDFToolsTests/CorpusRunnerCore.swift \"$DEST/PDFToolsTests/\" 2>/dev/null || true\nchmod +x \"$DEST/Scripts/release-check.sh\" 2>/dev/null || true\nexit 0\n";
